<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>Student Login Portal</title>
 <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
 <style>
   * { box-sizing: border-box; }

   body {
     font-family: Arial, sans-serif;
     background: linear-gradient(to right, #ede7f6, #bbdefb);
     margin: 0;
     min-height: 100vh;
     display: flex;
     align-items: center;
     justify-content: center;
     padding: 20px;
     text-align: center;
   }

   .page-wrap {
     width: 100%;
     max-width: 420px;
   }

   h1 {
     color: #000;
     margin: 0 0 16px;
     font-size: clamp(24px, 5vw, 34px);
     text-shadow: 1px 1px 2px #9fa8da;
   }

   .subtitle {
     margin: 0 0 20px;
     color: #2f2450;
     font-size: 15px;
   }

   .login-box {
     background: rgba(212, 70, 200, 0.2);
     padding: 24px 18px;
     width: 100%;
     border-radius: 18px;
     box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
     border: 2px solid #3f51b5;
   }

   .login-box h2 {
     margin: 0 0 18px;
     color: #100c1a;
     font-size: 22px;
   }

   .field {
     position: relative;
     margin-bottom: 14px;
   }

   .field i.left-icon {
     position: absolute;
     left: 14px;
     top: 50%;
     transform: translateY(-50%);
     color: #3f51b5;
     font-size: 15px;
   }

   .field input {
     width: 100%;
     padding: 13px 44px 13px 42px;
     border: 1px solid #9fa8da;
     border-radius: 10px;
     background-color: #f7f7fb;
     font-size: 15px;
     outline: none;
     transition: 0.25s ease;
   }

   .field input:focus {
     border-color: #3f51b5;
     box-shadow: 0 0 0 3px rgba(63, 81, 181, 0.15);
   }

   .toggle-pass {
     position: absolute;
     right: 10px;
     top: 50%;
     transform: translateY(-50%);
     border: 0;
     background: transparent;
     color: #3f51b5;
     cursor: pointer;
     font-size: 16px;
     width: 34px;
     height: 34px;
   }

   .login-box button.submit-btn {
     padding: 13px;
     width: 100%;
     background-color: #3f51b5;
     color: white;
     border: none;
     cursor: pointer;
     border-radius: 10px;
     font-weight: bold;
     font-size: 15px;
     transition: 0.25s ease;
     margin-top: 4px;
   }

   .login-box button.submit-btn:hover {
     background-color: #283593;
     transform: translateY(-1px);
   }

   #message {
     margin-top: 14px;
     font-weight: bold;
     font-size: 15px;
     min-height: 22px;
   }

   @media (max-width: 480px) {
     body { padding: 14px; }
     .login-box { padding: 20px 14px; }
     h1 { margin-bottom: 12px; }
     .subtitle { font-size: 14px; margin-bottom: 16px; }
     .field input { font-size: 14px; }
   }
 </style>
</head>
<body>
 <div class="page-wrap">
   <h1><i class="fa-solid fa-graduation-cap"></i> Student Login Portal</h1>
   <p class="subtitle">Welcome back! Please sign in to continue.</p>

   <div class="login-box">
     <h2>Login to your account</h2>

     <div class="field">
       <i class="fa-solid fa-user left-icon"></i>
       <input type="text" id="username" placeholder="Username" autocomplete="username">
     </div>

     <div class="field">
       <i class="fa-solid fa-lock left-icon"></i>
       <input type="password" id="password" placeholder="Password" autocomplete="current-password">
       <button type="button" class="toggle-pass" onclick="togglePassword()" aria-label="Show or hide password">
         <i class="fa-solid fa-eye" id="eyeIcon"></i>
       </button>
     </div>

     <button class="submit-btn" onclick="login()"><i class="fa-solid fa-right-to-bracket"></i> Sign In</button>
     <p id="message"></p>
   </div>
 </div>

 <script>
 var users = [
   {username: "racheil", password: "2004"},
   {username: "student1", password: "1111"},
   {username: "student2", password: "2222"}
 ];

 var attempts = 0;
 var maxAttempts = 3;

 function togglePassword() {
   var pass = document.getElementById("password");
   var eye = document.getElementById("eyeIcon");
   if (pass.type === "password") {
     pass.type = "text";
     eye.className = "fa-solid fa-eye-slash";
   } else {
     pass.type = "password";
     eye.className = "fa-solid fa-eye";
   }
 }

 function login() {
   var user = document.getElementById("username").value.trim();
   var pass = document.getElementById("password").value;
   var msg = document.getElementById("message");

   if (attempts >= maxAttempts) {
     msg.innerHTML = "❌ Your account is locked.";
     msg.style.color = "red";
     return;
   }

   var found = users.find(u => u.username === user && u.password === pass);

   if (found) {
     msg.innerHTML = "✅ Welcome, " + user + "!";
     msg.style.color = "green";
     attempts = 0;
   } else {
     attempts++;
     if (attempts >= maxAttempts) {
       msg.innerHTML = "❌ Your account is locked.";
       msg.style.color = "red";
     } else {
       msg.innerHTML = "⚠️ Incorrect username or password. Attempts left: " + (maxAttempts - attempts);
       msg.style.color = "#111";
     }
   }
 }
</script>
</body>
</html>
